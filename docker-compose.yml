# Fixed project name: keeps the container name atrapfare-web-1 that
# ~/traefik/config/dynamic.yml routes to, independent of the checkout's dirname.
# Routing, TLS and redirects (www, .de, .net) live only in dynamic.yml: Traefik
# uses the file provider, so container labels would have no effect.
#
# Hardening as on every container of the VPS: non-root, read-only root
# filesystem, no capabilities, no-new-privileges, memswap_limit = mem_limit.
name: atrapfare

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    # nginx as uid 101 (see nginx/nginx.conf), same as the built images of the other sites.
    user: "101:101"
    volumes:
      - /var/www/atrapfare:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Mounted over the image's default.conf so that one is not loaded as well.
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *hardening
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - traefik
    mem_limit: 64m
    memswap_limit: 64m
    logging: *logging

networks:
  traefik:
    external: true
