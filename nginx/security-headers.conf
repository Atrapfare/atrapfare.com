# Included in every location that serves pages: a location with its own add_header would otherwise
# drop headers set at server level. HSTS, X-Frame-Options and nosniff also come from Traefik.
# Site rule (see README): no inline JS or CSS, fonts self-hosted — so everything is strictly 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
