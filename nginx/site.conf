server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # File names are not hashed: pages, CSS and JS are revalidated on every visit (cheap 304s via
    # ETag/Last-Modified), so a deploy is visible immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Fonts never change under the same name.
    location /assets/fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Photo and icons: a week is plenty.
    location ~ ^/(assets/img/|favicon/|favicon\.ico$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # PDFs: no CSP, browsers' built-in PDF viewers can break under one.
    location /cv/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
