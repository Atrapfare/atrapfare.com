# Shared nginx main config — identical in every site repo on the VPS (see ~/SERVER.md, 2.3).
# The site itself lives in conf.d/site.conf.
#
# nginx runs as uid 101 on a read-only root filesystem with all capabilities dropped, so pid and
# temp files go to /tmp (a tmpfs). Port 80 inside the container still works for a non-root user
# because Docker sets net.ipv4.ip_unprivileged_port_start=0 in container network namespaces.
# TLS, HSTS and compression (br/zstd/gzip) are done by Traefik in front of every site.

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # No version number in the Server header or on error pages.
    server_tokens  off;

    # Relative Location headers: nginx only sees http on port 80 behind Traefik and would
    # otherwise redirect /dir to http://host/dir/ (one extra hop through Traefik's https redirect).
    absolute_redirect  off;

    include /etc/nginx/conf.d/*.conf;
}
